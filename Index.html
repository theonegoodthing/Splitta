<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swish-Delaren – Dela festnotan rättvist</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 560px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .summary-grid .card {
      margin-bottom: 0;
      padding: 16px;
    }

    .card-title {
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .big-value {
      font-size: 1.65rem;
      font-weight: 700;
    }

    .add-person-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-green {
      background: var(--green);
      color: #052e16;
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .person-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .person-name {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .person-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .balance-tag {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .balance-plus {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }

    .balance-minus {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
    }

    .balance-zero {
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
    }

    .add-expense-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .add-expense-row input[type="number"] {
      max-width: 140px;
    }

    .expense-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .expense-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .expense-pill:hover {
      border-color: var(--red);
      color: var(--text);
    }

    .swish-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .swish-row {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--green);
      padding: 14px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 1rem;
    }

    .swish-amount {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--green);
    }

    .actions-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 10px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>💸 Swish-Delaren <span class="badge">Rättvis uppdelning</span></h1>
    </div>
    <button class="btn btn-secondary" id="resetAllBtn" type="button">Nollställ allt</button>
  </header>

  <!-- Översikt -->
  <div class="summary-grid">
    <div class="card">
      <div class="card-title">Total festkostnad</div>
      <div class="big-value" id="totalGroupCost">0 kr</div>
    </div>
    <div class="card">
      <div class="card-title">Antal personer</div>
      <div class="big-value" id="totalPeopleCount">0 st</div>
    </div>
    <div class="card">
      <div class="card-title">Kostnad per person</div>
      <div class="big-value" id="costPerPerson" style="color: var(--accent);">0 kr</div>
    </div>
  </div>

  <!-- Lägg till person -->
  <div class="card">
    <div class="card-title">Lägg till deltagare i sällskapet</div>
    <form class="add-person-row" id="addPersonForm">
      <input type="text" id="newPersonName" placeholder="Namn (t.ex. Kalle, Anna, Erik...)" required />
      <button class="btn" type="submit">+ Lägg till</button>
    </form>
  </div>

  <!-- Lista över personer & deras utlägg -->
  <div id="peopleContainer"></div>

  <!-- Resultat: Vem Swishar vem -->
  <div class="card" style="border-color: rgba(34, 197, 94, 0.4);">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <div class="card-title" style="margin-bottom:0; color: var(--green);">Så här ska ni Swisha varandra</div>
      <button class="btn btn-green" id="copySummaryBtn" type="button">📋 Kopiera sammanställning</button>
    </div>
    <div class="swish-list" id="swishResultContainer">
      <div class="empty-state">Lägg till minst två personer och fyll i utläggen ovan så räknas Swish-listan ut direkt.</div>
    </div>
    <div id="copyFeedback" style="color: var(--green); font-size: 0.82rem; margin-top: 8px;"></div>
  </div>

  <script>
    let members = [];

    function saveState() {
      localStorage.setItem('swish_delaren_members', JSON.stringify(members));
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('swish_delaren_members');
        if (saved) {
          members = JSON.parse(saved);
        }
      } catch (e) {
        members = [];
      }
    }

    function formatKr(num) {
      const rounded = Math.round(num * 100) / 100;
      return rounded % 1 === 0
        ? `${rounded.toLocaleString('sv-SE')} kr`
        : `${rounded.toFixed(2).replace('.', ',')} kr`;
    }

    function getMemberTotal(member) {
      return member.expenses.reduce((sum, item) => sum + item.amount, 0);
    }

    function addMember(name) {
      const cleanName = name.trim();
      if (!cleanName) return;
      members.push({
        id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        expenses: []
      });
      saveState();
      renderAll();
    }

    function removeMember(id) {
      members = members.filter(m => m.id !== id);
      saveState();
      renderAll();
    }

    function addExpense(memberId, amount, note) {
      const val = parseFloat(String(amount).replace(',', '.'));
      if (isNaN(val) || val <= 0) return;

      const member = members.find(m => m.id === memberId);
      if (!member) return;

      member.expenses.push({
        id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
        amount: val,
        note: (note || '').trim()
      });

      saveState();
      renderAll();
    }

    function removeExpense(memberId, expenseId) {
      const member = members.find(m => m.id === memberId);
      if (!member) return;
      member.expenses = member.expenses.filter(e => e.id !== expenseId);
      saveState();
      renderAll();
    }

    // Algoritm för minimalt antal Swish-transaktioner
    function calculateSettlements(balances) {
      const debtors = [];
      const creditors = [];

      balances.forEach(b => {
        if (b.diff < -0.01) {
          debtors.push({ name: b.name, amount: -b.diff });
        } else if (b.diff > 0.01) {
          creditors.push({ name: b.name, amount: b.diff });
        }
      });

      // Sortera störst skuld och störst fordran först för färre transaktioner
      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let i = 0;
      let j = 0;

      while (i < debtors.length && j < creditors.length) {
        const debtor = debtors[i];
        const creditor = creditors[j];
        const payAmount = Math.min(debtor.amount, creditor.amount);

        if (payAmount >= 0.5) {
          transactions.push({
            from: debtor.name,
            to: creditor.name,
            amount: Math.round(payAmount)
          });
        }

        debtor.amount -= payAmount;
        creditor.amount -= payAmount;

        if (debtor.amount < 0.01) i++;
        if (creditor.amount < 0.01) j++;
      }

      return transactions;
    }

    function renderAll() {
      const count = members.length;
      const totalCost = members.reduce((sum, m) => sum + getMemberTotal(m), 0);
      const sharePerPerson = count > 0 ? totalCost / count : 0;

      document.getElementById('totalGroupCost').textContent = formatKr(totalCost);
      document.getElementById('totalPeopleCount').textContent = `${count} st`;
      document.getElementById('costPerPerson').textContent = formatKr(sharePerPerson);

      const container = document.getElementById('peopleContainer');
      container.innerHTML = '';

      const balances = [];

      members.forEach(member => {
        const paid = getMemberTotal(member);
        const diff = paid - sharePerPerson;
        balances.push({ name: member.name, paid, diff });

        let balanceHtml = `<span class="balance-tag balance-zero">Jämnt (0 kr)</span>`;
        if (diff > 0.5) {
          balanceHtml = `<span class="balance-tag balance-plus">Ska få tillbaka ${formatKr(Math.round(diff))}</span>`;
        } else if (diff < -0.5) {
          balanceHtml = `<span class="balance-tag balance-minus">Ska betala ${formatKr(Math.round(Math.abs(diff)))}</span>`;
        }

        const card = document.createElement('div');
        card.className = 'person-card';

        const pillsHtml = member.expenses.map(exp => {
          const label = exp.note ? `${exp.note}: ${formatKr(exp.amount)}` : formatKr(exp.amount);
          return `<span class="expense-pill" data-member="${member.id}" data-exp="${exp.id}" title="Klicka för att ta bort">${label} ✕</span>`;
        }).join('');

        card.innerHTML = `
          <div class="person-header">
            <div>
              <div class="person-name">${escapeHtml(member.name)} ${balanceHtml}</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="person-total">${formatKr(paid)}</div>
              <button class="btn btn-danger" data-remove-member="${member.id}" type="button">Ta bort</button>
            </div>
          </div>
          <form class="add-expense-row" data-expense-form="${member.id}">
            <input type="number" step="any" min="0" placeholder="Belopp (kr)" required />
            <input type="text" placeholder="Vad? (valfritt, t.ex. Mat, Öl)" />
            <button class="btn" type="submit">+ Addera</button>
          </form>
          <div class="expense-pills">${pillsHtml}</div>
        `;

        container.appendChild(card);
      });

      // Koppla event listeners för formulär och borttagning
      container.querySelectorAll('[data-expense-form]').forEach(form => {
        form.addEventListener('submit', e => {
          e.preventDefault();
          const memberId = form.getAttribute('data-expense-form');
          const numInput = form.querySelector('input[type="number"]');
          const textInput = form.querySelector('input[type="text"]');
          addExpense(memberId, numInput.value, textInput.value);
        });
      });

      container.querySelectorAll('[data-remove-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          removeMember(btn.getAttribute('data-remove-member'));
        });
      });

      container.querySelectorAll('.expense-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          removeExpense(pill.getAttribute('data-member'), pill.getAttribute('data-exp'));
        });
      });

      // Rendera Swish-listan
      const swishContainer = document.getElementById('swishResultContainer');
      if (count < 2) {
        swishContainer.innerHTML = `<div class="empty-state">Lägg till minst två personer för att räkna ut Swish-överföringar.</div>`;
        return;
      }

      const settlements = calculateSettlements(balances);
      if (settlements.length === 0) {
        swishContainer.innerHTML = `<div class="empty-state" style="color: var(--green);">Alla har lagt ut exakt lika mycket – ingen behöver Swisha någon!</div>`;
        return;
      }

      swishContainer.innerHTML = settlements.map(s => `
        <div class="swish-row">
          <div><strong>${escapeHtml(s.from)}</strong> Swishar till <strong>${escapeHtml(s.to)}</strong></div>
          <div class="swish-amount">${s.amount.toLocaleString('sv-SE')} kr</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    document.getElementById('addPersonForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('newPersonName');
      addMember(input.value);
      input.value = '';
      input.focus();
    });

    document.getElementById('resetAllBtn').addEventListener('click', () => {
      if (confirm('Vill du rensa alla personer och belopp?')) {
        members = [];
        saveState();
        renderAll();
      }
    });

    document.getElementById('copySummaryBtn').addEventListener('click', async () => {
      if (members.length < 2) return;
      const totalCost = members.reduce((sum, m) => sum + getMemberTotal(m), 0);
      const share = totalCost / members.length;
      const balances = members.map(m => ({ name: m.name, diff: getMemberTotal(m) - share }));
      const settlements = calculateSettlements(balances);

      let text = `🎉 Festnota – Totalt: ${formatKr(totalCost)} (${formatKr(Math.round(share))}/pers)\n\n`;
      text += `Utlägg:\n`;
      members.forEach(m => {
        text += `• ${m.name}: ${formatKr(getMemberTotal(m))}\n`;
      });
      text += `\n💸 Swish-lista:\n`;
      if (settlements.length === 0) {
        text += `Ingen behöver Swisha – allt är jämnt!\n`;
      } else {
        settlements.forEach(s => {
          text += `• ${s.from} Swishar ${s.amount} kr till ${s.to}\n`;
        });
      }

      try {
        await navigator.clipboard.writeText(text);
        const fb = document.getElementById('copyFeedback');
        fb.textContent = 'Kopierat! Nu kan du klistra in listan direkt i chatten.';
        setTimeout(() => { fb.textContent = ''; }, 3500);
      } catch (err) {
        alert(text);
      }
    });

    loadState();
    renderAll();
  </script>
</body>
</html>
